name: PHP Tests

on:
  push:
    branches-ignore: [ master, main ]
  pull_request:
    branches-ignore: [ master, main ]

jobs:
  unit-tests:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        php: [ 8.5, 8.4, 8.3 ]
        os: [ubuntu-latest]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v3
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: opcache, gd, zip
          tools: composer:v2, phpunit
          coverage: none
        env:
          COMPOSER_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Install packages
        run: |
          sudo apt-get -y update -qq  < /dev/null > /dev/null
          sudo apt-get -y install -qq git zip php-zip < /dev/null > /dev/null
      - name: Get composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir -d bin/builder)" >> $GITHUB_OUTPUT
      - name: Cache dependencies
        uses: actions/cache@v3
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: ${{ runner.os }}-composer-
      - name: Build Gantry packages
        run: composer build-dev
      - name: Run modern dependency and Twig integration checks
        run: php tests/modern/dependencies.php platforms/wordpress/gantry5/vendor/autoload.php
      - name: Run download and Unicode runtime regression checks
        run: php tests/php85/runtime.php
      - name: Run targeted PHP 8.4/8.5 nullable-rewriter checks
        if: matrix.php == '8.4' || matrix.php == '8.5'
        run: php tests/php84/nullable-rewriter.php
      - name: Run outline snapshot filesystem checks
        if: matrix.php == '8.4' || matrix.php == '8.5'
        run: php tests/php84/upgrade-snapshot.php platforms/joomla/lib_gantry5/vendor/autoload.php
      - name: Run design-pack filesystem and bitmap checks
        if: matrix.php == '8.4' || matrix.php == '8.5'
        run: php tests/php84/design-pack.php
      - name: Run approved client-text filesystem checks
        if: matrix.php == '8.4' || matrix.php == '8.5'
        run: php tests/php84/client-editing.php platforms/joomla/lib_gantry5/vendor/autoload.php

