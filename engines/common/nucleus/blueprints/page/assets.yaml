name: Assets
description: Assets such as JS and CSS that can be globally loaded
type: global

form:
  fields:

    version:
      type: input.checkbox
      label: Immutable local asset URLs
      description: Prepare optional local CSS and JavaScript with content-addressed URLs. Native compiled theme CSS always retains immutable URLs for safe publication and undo.
      default: true

    minify:
      type: input.checkbox
      label: Minify prepared local assets
      description: Minify during save or compilation, never while serving a page. Remote assets and scripts with unsupported relocation semantics remain native.
      default: true

    combine:
      type: input.checkbox
      label: Combine compatible local assets
      description: Use prepared adjacent pairs only when ordering, attributes, dependencies and inline boundaries permit it.
      default: true

    main_image:
      type: input.imagepicker
      label: Main page image
      description: Optional local image to prioritize eagerly. Otherwise the first eligible rendered image is eager; other eligible images default to lazy loading.
      filter: '.(jpe?g|png|webp|avif)$'

    favicon:
      type: input.imagepicker
      label: Favicon
      filter: '.(jpe?g|gif|png|svg|ico)$'

    touchicon:
      type: input.imagepicker
      label: Touch Icon
      description: 'A PNG only image that will be used as icon for Touch Devices. Recommended 180x180 or 192x192.'
      filter: '.png$'

    css:
      type: collection.list
      array: true
      label: CSS
      description: Add remove or modify custom CSS assets.
      value: name
      ajax: true

      fields:

        .name:
          type: input.text
          label: Name
          skip: true

        .location:
          type: input.filepicker
          label: File Location
          icon: far fa-file-code
          placeholder: 'http://cdn1.remote/file.css'
          filter: '\.(css|less|scss|sass)$'
          root: 'gantry-assets://'

        .inline:
          type: textarea.textarea
          label: Inline CSS
          description: Adds inline CSS for quick snippets.

        _info:
          type: separator.note
          class: alert alert-info
          content: 'Only add your inline CSS code, the &lt;style&gt;&lt;/style&gt; tags will get automatically added for you.'

        .extra:
          type: collection.keyvalue
          label: Tag attributes
          key_placeholder: 'Key (data-*, style, ...)'
          value_placeholder: Value
          exclude: ['rel', 'href', 'type']

        .priority:
          type: input.number
          label: Load Priority
          description: 'Sets the load priority of the asset in the page. Value can be between 10 (first) and -10 (last). Default value is 0.'
          default: 0
          min: -10
          max: 10

    javascript:
      type: collection.list
      array: true
      label: Javascript
      description: Add remove or modify custom Javascript assets.
      value: name
      ajax: true

      fields:

        .name:
          type: input.text
          label: Name
          skip: true

        .location:
          type: input.filepicker
          label: File Location
          icon: far fa-file-code
          placeholder: 'http://cdn1.remote/file.js'
          filter: '\.(jsx?|coffee)$'
          root: 'gantry-assets://'

        .inline:
          type: textarea.textarea
          label: Inline JavaScript
          description: Adds inline JavaScript for quick snippets.

        _info:
          type: separator.note
          class: alert alert-info
          content: 'Only add your inline JavaScript code, the &lt;script&gt;&lt;/script&gt; tags will get automatically added for you.'

        .in_footer:
          type: input.checkbox
          label: 'Before </body>'
          description: Whether you want the script to load at the end of the body tag or inside head
          default: false

        .extra:
          type: collection.keyvalue
          label: Tag attributes
          exclude: ['src', 'type']

        .priority:
          type: input.number
          label: Load Priority
          description: 'Sets the load priority of the asset in the page. Value can be between 10 (first) and -10 (last). Default value is 0.'
          default: 0
          min: -10
          max: 10
